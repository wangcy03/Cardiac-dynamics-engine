<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>有限体积输运与两向特征传播</title><style>

(--muted);margin-top:12px}.equation details{margin-bottom:0}.table-scroll{width:100%;overflow-x:auto;min-width:0;margin:20px 0}table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.7}th{text-align:left;font-weight:600;background:var(--paper2)}td,th{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}td:first-child{font-weight:500}td code.hash{font-size:11px;word-break:break-all}figure{margin:28px 0;min-width:0;max-width:100%}.diagram-container{width:100%;overflow-x:auto;min-width:0}.diagram-container svg{display:block;width:100%;min-width:1280px;height:auto}svg .node-name{font-family:var(--sans);font-size:12px;font-weight:600;fill:var(--ink)}svg .sub{font-family:var(--mono);font-size:9px;fill:var(--muted)}svg .cn{font-family:var(--sans);font-size:12px;font-weight:500;fill:var(--muted)}svg .label{font-family:var(--mono);font-size:8px;fill:var(--soft);letter-spacing:.06em}svg .group-name{font-family:var(--sans);font-size:14px;font-weight:600;fill:var(--ink)}svg .caption{font-family:var(--sans);font-size:12px;fill:var(--muted)}svg .node{fill:#fff;stroke:var(--ink);stroke-width:1}svg .focal{fill:var(--tint);stroke:var(--accent);stroke-width:1.2}svg .future{fill:var(--paper);stroke:var(--muted);stroke-width:1;stroke-dasharray:4 3}svg .arrow{fill:none;stroke:var(--muted);stroke-width:1.2}svg .planned{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:5 4}svg .mask{fill:var(--paper)}figcaption{margin:12px 0 0}.source{font-size:14px;color:var(--muted)}footer{font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-bottom:60px}ul,ol{padding-left:24px}li{margin:6px 0}.key{font-weight:600}.evidence-generated h3{margin-top:36px}.evidence-generated table{font-size:13px}.equation-number{font:12px var(--mono);color:var(--soft);margin-bottom:10px}

</style></head><body><main><h1>有限体积输运与两向特征传播</h1><div class="diagram-container"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="principles-control-volume-title principles-control-volume-desc" xmlns="http://www.w3.org/2000/svg">
<title id="principles-control-volume-title">有限体积输运与两向特征传播</title>
<desc id="principles-control-volume-desc">相邻控制体共享同一个界面通量，内部通量逐对抵消；亚临界流中信息沿 u 加 c 与 u 减 c 两个特征方向传播。</desc>
<defs><marker id="pc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="pc-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="pc-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="80" y="80" class="group-name">同一个界面通量，给左侧减去、给右侧加上。</text>
<line x1="352" y1="240" x2="512" y2="240" class="arrow" marker-end="url(#pc-arrow)"/><line x1="768" y1="240" x2="928" y2="240" class="arrow" marker-end="url(#pc-arrow)"/>
<rect x="384" y="216" width="96" height="16" class="mask"/><text x="432" y="228" class="cn" text-anchor="middle">共享左通量</text><rect x="800" y="216" width="96" height="16" class="mask"/><text x="848" y="228" class="cn" text-anchor="middle">共享右通量</text>
<line x1="240" y1="440" x2="1040" y2="440" class="arrow" marker-end="url(#pc-arrow)"/><rect x="592" y="420" width="96" height="12" class="mask"/><text x="640" y="429" class="label" text-anchor="middle">u + c / W+</text>
<line x1="1040" y1="528" x2="240" y2="528" class="planned" marker-end="url(#pc-arrow)"/><rect x="592" y="508" width="96" height="12" class="mask"/><text x="640" y="517" class="label" text-anchor="middle">u - c / W-</text>
<g><rect x="96" y="168" width="256" height="144" rx="6" class="node"/><text x="224" y="228" class="node-name" text-anchor="middle">上游控制体</text><text x="224" y="256" class="sub" text-anchor="middle">U[i-1] = (A,Q)</text><rect x="512" y="168" width="256" height="144" rx="6" class="focal"/><text x="640" y="228" class="node-name" text-anchor="middle">正在更新的控制体</text><text x="640" y="256" class="sub" text-anchor="middle">U[i] = (A,Q)</text><rect x="928" y="168" width="256" height="144" rx="6" class="node"/><text x="1056" y="228" class="node-name" text-anchor="middle">下游控制体</text><text x="1056" y="256" class="sub" text-anchor="middle">U[i+1] = (A,Q)</text></g>
<text x="80" y="376" class="caption">面积 × 管长是血液体积；信息传播方向不等于每一时刻的血流方向。</text><text x="80" y="588" class="caption">亚临界条件 |u| &lt; c：两端各有一个入射特征，不能在入口同时任意指定 P 与 Q。</text>
<line x1="40" y1="652" x2="1240" y2="652" stroke="#bfc0c0"/><text x="80" y="684" class="cn">框：有限体积状态</text><text x="400" y="684" class="cn">上层箭头：共享通量</text><text x="864" y="684" class="cn">下层箭头：两向信息传播</text>
</svg></div><p class="small">本预览由 MATHEMATICAL_PRINCIPLES.html 的原图导出；正文是维护源。</p></main></body></html>
