<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>从连续状态到可执行命令的因果时序</title><style>

</style></head><body><main><h1>从连续状态到可执行命令的因果时序</h1><div class="diagram-container"><svg viewBox="0 0 1280 720" role="img" aria-labelledby="principles-sequence-title principles-sequence-desc" xmlns="http://www.w3.org/2000/svg">
<title id="principles-sequence-title">从连续状态到可执行命令的因果时序</title>
<desc id="principles-sequence-desc">调度器先推进连续状态，依次处理既有事件、采样和交付，控制器才提交新命令，执行器在后续边界开始实际动作。</desc>
<defs><marker id="ps-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="ps-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#bf4520"/></marker><marker id="ps-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker><marker id="ps-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0,8 3,0 6" fill="none" stroke="#4f5d75" stroke-width="1.2"/></marker></defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text x="80" y="64" class="group-name">时间向下；边界内有固定先后，不代表图中箭头之间相隔固定毫秒数。</text>
<g stroke="#bfc0c0" stroke-dasharray="3 3"><line x1="160" y1="160" x2="160" y2="620"/><line x1="400" y1="160" x2="400" y2="620"/><line x1="640" y1="160" x2="640" y2="620"/><line x1="880" y1="160" x2="880" y2="620"/><line x1="1120" y1="160" x2="1120" y2="620"/></g>
<line x1="160" y1="216" x2="400" y2="216" class="arrow" marker-end="url(#ps-arrow)"/><rect x="220" y="192" width="120" height="16" class="mask"/><text x="280" y="204" class="cn" text-anchor="middle">推进上一连续段</text>
<line x1="160" y1="284" x2="400" y2="284" class="planned" marker-end="url(#ps-open)"/><rect x="220" y="260" width="120" height="16" class="mask"/><text x="280" y="272" class="cn" text-anchor="middle">电／机械驱动事件</text>
<line x1="160" y1="352" x2="1120" y2="352" class="planned" marker-end="url(#ps-open)"/><rect x="940" y="328" width="120" height="16" class="mask"/><text x="1000" y="340" class="cn" text-anchor="middle">执行先前预约命令</text>
<line x1="400" y1="420" x2="640" y2="420" class="arrow" marker-end="url(#ps-arrow)"/><rect x="472" y="396" width="96" height="16" class="mask"/><text x="520" y="408" class="cn" text-anchor="middle">当前真值采样</text>
<line x1="640" y1="488" x2="880" y2="488" stroke="#bf4520" stroke-width="1.2" marker-end="url(#ps-accent)"/><rect x="700" y="464" width="120" height="16" class="mask"/><text x="760" y="476" class="cn" text-anchor="middle">到可用时刻才交付</text>
<line x1="880" y1="556" x2="160" y2="556" class="arrow" marker-end="url(#ps-arrow)"/><rect x="460" y="532" width="120" height="16" class="mask"/><text x="520" y="544" class="cn" text-anchor="middle">按当前 now 提交</text>
<line x1="160" y1="612" x2="1120" y2="612" class="planned" marker-end="url(#ps-open)"/><rect x="928" y="588" width="144" height="16" class="mask"/><text x="1000" y="600" class="cn" text-anchor="middle">后续边界开始新动作</text>
<g><rect x="64" y="104" width="192" height="56" rx="6" class="node"/><text x="160" y="136" class="node-name" text-anchor="middle">调度器</text><rect x="304" y="104" width="192" height="56" rx="6" class="node"/><text x="400" y="136" class="node-name" text-anchor="middle">连续物理状态</text><rect x="544" y="104" width="192" height="56" rx="6" class="node"/><text x="640" y="136" class="node-name" text-anchor="middle">测量／交付队列</text><rect x="784" y="104" width="192" height="56" rx="6" class="node"/><text x="880" y="136" class="node-name" text-anchor="middle">控制器</text><rect x="1024" y="104" width="192" height="56" rx="6" class="node"/><text x="1120" y="136" class="node-name" text-anchor="middle">执行器</text></g>
<line x1="40" y1="652" x2="1240" y2="652" stroke="#bfc0c0"/><text x="80" y="684" class="cn">实线：调用／数据交付</text><text x="416" y="684" class="cn">虚线开箭头：异步事件</text><text x="864" y="684" class="cn">控制器接口：Sample + now_us</text>
</svg></div><p class="small">本预览由 MATHEMATICAL_PRINCIPLES.html 的原图导出；正文是维护源。</p></main></body></html>
