[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iabp-physics-prototype"
version = "0.2.0"
description = "Research-only causal IABP simulation scaffold and conservative 0D prototype"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "scipy>=1.14,<2", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools]
packages = ["iabp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["iabp"]
